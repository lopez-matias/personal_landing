<!doctype html>
<html lang="es-UY" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada | MatuDev</title>
    <meta
      name="description"
      content="La página solicitada no existe en MatuDev."
    />
    <meta name="robots" content="noindex,follow" />
    <link
      rel="icon"
      href="assets/img/favicon-computer.png"
      type="image/png"
      sizes="128x128"
    />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-computer.png" />
    <link rel="stylesheet" href="assets/css/system.css?v=20261011-4" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("matudev-system-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch (error) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipLink"
      >Saltar al contenido</a
    >
    <header class="topbar">
      <nav
        class="container nav"
        aria-label="Navegación principal"
        data-i18n-attr="aria-label:navAria"
      >
        <a
          class="brand"
          href="index.html"
          aria-label="MatuDev, volver al inicio"
          data-i18n-attr="aria-label:brandAria"
          ><strong>MatuDev</strong></a
        >
        <div class="nav-actions">
          <button
            class="theme-icon-button"
            type="button"
            data-theme-toggle
            aria-label="Cambiar tema"
            data-i18n-attr="aria-label:themeAria"
          >
            <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
          </button>
          <div class="language-switch">
            <a
              class="flag-link"
              href="?lang=en"
              data-language-switch
              aria-label="English version"
              ><img
                data-language-flag
                src="assets/img/flag-us.svg"
                alt=""
                width="27"
                height="18"
            /></a>
          </div>
          <a
            href="index.html#contacto"
            data-preserve-language
            data-i18n="navContact"
            >Contacto</a
          >
        </div>
      </nav>
    </header>
    <main id="main" class="container simple-page">
      <section
        class="system-window simple-content"
        aria-labelledby="not-found-title"
      >
        <div class="window-bar"><span>404.sys</span><span>not found</span></div>
        <div class="window-body">
          <span class="stamp" data-i18n="notFoundKicker"
            >ERROR / RUTA NO ENCONTRADA</span
          >
          <h1 id="not-found-title" data-i18n="notFoundTitle">
            Esta pantalla no existe.
          </h1>
          <p class="lead" data-i18n="notFoundLead">
            La URL fue movida o no está disponible. Podés volver al inicio o
            escribirme si buscabas información sobre un proyecto.
          </p>
          <div class="simple-actions">
            <a
              class="button button-dark"
              href="index.html"
              data-i18n="goHome"
              data-preserve-language
              >Ir al inicio</a
            >
            <a class="button" href="mailto:lopeznunezmati@gmail.com">Email</a>
            <a
              class="button"
              href="https://www.linkedin.com/in/lopez-matias/"
              target="_blank"
              rel="noopener noreferrer"
              >LinkedIn ↗</a
            >
            <a
              class="button"
              href="https://github.com/lopez-matias"
              target="_blank"
              rel="noopener noreferrer"
              >GitHub ↗</a
            >
          </div>
        </div>
      </section>
    </main>
    <a
      class="top-bubble"
      href="#main"
      aria-label="Volver al inicio"
      data-i18n-attr="aria-label:backTopAria"
    >
      <span aria-hidden="true">↑</span>
    </a>
    <script src="assets/js/i18n.js?v=20261011-4" defer></script>
    <script src="assets/js/system.js?v=20261011-4" defer></script>
  </body>
</html>
